# Builds projects/racket with tools/check on a GitHub runner, the way the enrollment check does, before the project
# is submitted. Not for upstream.
name: "Racket check"

on:
  workflow_dispatch:
    inputs:
      twice:
        description: "Build a second time from scratch and compare the bytes"
        type: boolean
        default: true
      checks:
        description: "Measure the checks of the fuzz targets and the binaries (tools/check --checks)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Make room and install PyYAML
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          dpkg -s python3-yaml > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Get qemu-riscv64-static 10.0.11, as the Build check does
        if: inputs.checks
        run: |
          mkdir "$RUNNER_TEMP/qemu" && cd "$RUNNER_TEMP/qemu"
          deb=qemu-user_10.0.11+ds-0+deb13u1_amd64.deb
          curl -fsSL --retry 3 -o "$deb" https://snapshot.debian.org/file/a0eaa62f815efb2361d43b1e3f8011c17ad9123a
          echo "6b6fea55551fbcc1eb30e146ad5abdfbb49f8fa8c5998016242126de4d7f80df  $deb" | sha256sum -c --quiet
          dpkg-deb -x "$deb" . && ln -s qemu-riscv64 usr/bin/qemu-riscv64-static
          usr/bin/qemu-riscv64-static --version | grep -q 'version 10\.0\.11'
          echo "$RUNNER_TEMP/qemu/usr/bin" >> "$GITHUB_PATH"

      - name: Pull the pinned toolchain image
        run: docker pull "$(python3 tools/check --print-toolchain projects/racket < /dev/null)"

      - name: Build with tools/check
        env:
          TWICE: ${{ inputs.twice }}
          CHECKS: ${{ inputs.checks }}
        run: |
          code=0
          # disk and memory every 5 minutes, since a runner that runs out of either is shut down without a log
          (while sleep 300; do echo "[usage] $(df -h / | tail -1) | $(free -m | sed -n 2p)"; done) &
          twice=; [ "$TWICE" = true ] && twice=--twice
          checks=; [ "$CHECKS" = true ] && checks="--checks $RUNNER_TEMP/checks.md --checks-budget 45"
          python3 tools/check --no-shell $twice $checks --dir "$RUNNER_TEMP/check" \
            --summary "$RUNNER_TEMP/check-summary.md" projects/racket < /dev/null || code=$?
          echo "tools/check exited $code" >> "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP/check-summary.md" "$RUNNER_TEMP/checks.md"; do
            [ -f "$f" ] && { echo >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }
          done
          df -h /
          exit "$code"

      - name: Keep the manifest and the binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racket-check
          path: |
            ${{ runner.temp }}/check/manifest.yaml
            ${{ runner.temp }}/checks.md
            ${{ runner.temp }}/check/out/
          if-no-files-found: warn
